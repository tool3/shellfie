      <text y="226.8" font-family="'JetBrains Mono', monospace" font-size="14" xml:space="preserve"><tspan x="16" fill="#ffffff">    connection.</tspan><tspan x="142" fill="#31BAAF">connect</tspan><tspan x="200.8" fill="#ffffff">();</tspan></text>
